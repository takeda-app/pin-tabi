<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ピン旅</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Chivo+Mono:wght@400;600&display=swap">
<style>
/* Layout: 時刻表の索引地図。左に乗換案内パネル、右に全面の路線図。スマホは地図が上、パネルが下 */
:root{
  --sea:#dce6ec; --land:#fbfbf9; --edge:#aebbc4;
  --ink:#1b262e; --muted:#5d6a73; --panel:#ffffff; --hair:#dbe1e5; --soft:#eef2f4;
  --pin:#e0342a; --pin-ink:#ffffff; --trail:#1b262e; --ballast:#d9dcd5; --rail:#3a4650;
  --lf:none;
  --f-display:"Dela Gothic One","Hiragino Sans","Yu Gothic",sans-serif;
  --f-body:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic","Noto Sans JP",sans-serif;
  --f-num:"Chivo Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --sea:#0e1820; --land:#1a2731; --edge:#34464f;
  --ink:#e4ebef; --muted:#94a4ae; --panel:#121d25; --hair:#283741; --soft:#1a2731;
  --pin:#ff5848; --pin-ink:#ffffff; --trail:#ffffff; --ballast:#2c3a43; --rail:#c9d3d9;
  --lf:brightness(1.35) saturate(.9); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --sea:#0e1820; --land:#1a2731; --edge:#34464f;
  --ink:#e4ebef; --muted:#94a4ae; --panel:#121d25; --hair:#283741; --soft:#1a2731;
  --pin:#ff5848; --pin-ink:#ffffff; --trail:#ffffff; --ballast:#2c3a43; --rail:#c9d3d9;
  --lf:brightness(1.35) saturate(.9); color-scheme:dark;
}
html,body{height:100%}
[hidden]{display:none!important}
body{background:var(--panel);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.55;overflow:hidden}
*{box-sizing:border-box}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--pin);outline-offset:2px}

.app{display:grid;grid-template-columns:minmax(320px,380px) 1fr;height:100%}
.panel{overflow-y:auto;border-right:1px solid var(--hair);padding-block:20px 28px;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:18px;display:flex;flex-direction:column;gap:18px;min-width:0}
.brand{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.brand h1{font-family:var(--f-display);font-weight:400;font-size:30px;letter-spacing:.04em;margin:0;line-height:1}
.brand h1 i{font-style:normal;color:var(--pin)}
.brand p{margin:0;color:var(--muted);font-size:12.5px}

.search{display:grid;grid-template-columns:1fr 36px;gap:8px;align-items:center}
.field{display:flex;align-items:center;gap:10px;border:1px solid var(--hair);border-radius:8px;padding:6px 10px;background:var(--panel)}
.field label{font-size:11px;letter-spacing:.12em;color:var(--muted);width:2.6em;flex:none}
.field input{border:0;background:transparent;outline:none;width:100%;min-width:0;font-size:16px;font-weight:500;padding:4px 0}
.dot{width:10px;height:10px;border-radius:50%;flex:none;border:2px solid var(--ink)}
.dot.to{background:var(--ink)}
.stack{display:grid;gap:6px}
.swap{grid-row:span 1;width:36px;height:36px;border-radius:8px;border:1px solid var(--hair);background:var(--soft);cursor:pointer;display:grid;place-items:center}
.swap:hover{border-color:var(--muted)}
.dot.via{border-color:var(--pin);border-radius:2px;transform:rotate(45deg);width:9px;height:9px}
.field .rm{flex:none;border:0;background:transparent;color:var(--muted);cursor:pointer;font-size:16px;line-height:1;padding:2px 4px;border-radius:4px}
.field .rm:hover{color:var(--ink);background:var(--soft)}
.addvia{justify-self:start;border:1px dashed var(--hair);background:transparent;border-radius:8px;padding:5px 12px;font-size:12.5px;color:var(--muted);cursor:pointer}
.addvia:hover{color:var(--ink);border-color:var(--muted)}
.vtag{display:inline-block;font-size:10px;font-weight:700;color:var(--pin);border:1px solid var(--pin);border-radius:3px;padding:0 4px;margin-left:6px;vertical-align:1px}
.cta{margin-top:12px;display:flex;align-items:center;justify-content:center;gap:8px;width:100%;border:0;border-radius:8px;background:var(--pin);color:var(--pin-ink);font-weight:700;padding:11px 14px;cursor:pointer;letter-spacing:.06em;font-size:14px}
.cta svg{width:13px;height:13px}
.cta:hover{filter:brightness(1.06)}
.tip{position:absolute;left:8px;bottom:calc(100% + 10px);background:var(--ink);color:var(--panel);font-size:12.5px;font-weight:700;padding:7px 12px;border-radius:8px;white-space:nowrap;box-shadow:0 4px 14px rgba(10,20,30,.2)}
.tip::after{content:"";position:absolute;left:20px;top:100%;border:7px solid transparent;border-top-color:var(--ink)}
.btn.play.hint{animation:pulse 1.5s ease-out infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--pin) 60%,transparent)}100%{box-shadow:0 0 0 16px color-mix(in srgb,var(--pin) 0%,transparent)}}
@media (prefers-reduced-motion:reduce){.btn.play.hint{animation:none;box-shadow:0 0 0 4px color-mix(in srgb,var(--pin) 35%,transparent)}}
.row2{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row2 .field{flex:1}
.field input[type=time]{font-family:var(--f-num);font-size:15px}
.go{flex:none;border:0;background:var(--ink);color:var(--panel);border-radius:8px;padding:10px 18px;font-weight:700;cursor:pointer;letter-spacing:.06em}
.err{color:var(--pin);font-size:12.5px;margin:0}

.sortbar{display:flex;gap:4px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.sortbar h2{margin:0;font-size:12px;letter-spacing:.12em;color:var(--muted);font-weight:500}
.seg{display:inline-flex;border:1px solid var(--hair);border-radius:999px;padding:2px}
.seg button{border:0;background:transparent;border-radius:999px;padding:3px 10px;font-size:12px;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--panel)}

.routes{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.route{border:1px solid var(--hair);border-radius:10px;background:var(--panel);cursor:pointer;overflow:hidden}
.route:hover{border-color:var(--muted)}
.route.on{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
.rhead{display:grid;grid-template-columns:auto 1fr auto;gap:4px 12px;align-items:baseline;padding:12px 14px 10px;width:100%;text-align:left;border:0;background:transparent;cursor:pointer}
.rnum{font-family:var(--f-num);font-size:11px;color:var(--muted)}
.rtime{font-family:var(--f-num);font-size:19px;font-weight:600;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.rtime small{font-size:12px;color:var(--muted);font-weight:400;margin-left:6px}
.rdur{font-weight:700;font-size:14px;text-align:right}
.rmeta{grid-column:2 / 4;display:flex;gap:10px;color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
.tags{grid-column:1 / 4;display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.badge{font-size:10.5px;border-radius:4px;padding:1px 6px;background:var(--soft);color:var(--muted)}
.badge.fast{background:var(--ink);color:var(--panel)}
.chips{grid-column:1 / 4;display:flex;flex-wrap:wrap;gap:4px 6px;align-items:center;margin-top:2px}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:500}
.chip i{width:14px;height:5px;border-radius:3px;display:inline-block}
.chip + .chip::before{content:"›";color:var(--muted);margin-right:2px}

.detail{border-top:1px dashed var(--hair);padding:10px 14px 14px;display:grid;gap:0}
.lblock{border-radius:8px;margin-inline:-8px;padding-inline:8px;transition:background-color .25s,opacity .25s}
.lblock.now{background:color-mix(in srgb,var(--lc) 14%,var(--panel));box-shadow:inset 3px 0 0 var(--lc)}
.lblock.now .n{color:var(--ink)}
.detail.running .lblock.done,.detail.running .xf.done{opacity:.45}
.bar{position:relative}
.pdot{position:absolute;left:50%;top:var(--p,0%);width:13px;height:13px;margin:-6.5px 0 0 -6.5px;border-radius:50%;background:var(--pin);border:2px solid var(--panel);box-shadow:0 1px 4px rgba(0,0,0,.25);display:none}
.lblock.now .pdot{display:block}
.lblock.now .bar{box-shadow:0 0 0 2px color-mix(in srgb,var(--lc) 30%,transparent)}
.where{display:none;margin-top:3px;font-weight:700;color:var(--ink);font-size:12px}
.lblock.now .where{display:block}
.lblock.now .where::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--pin);margin-right:6px;vertical-align:1px}
.nowtag{display:none;margin-left:8px;font-weight:700;color:var(--pin)}
.xf.now .nowtag{display:inline}
.xf.now .xbar{border-left-color:var(--pin)}
.tl{display:grid;grid-template-columns:52px 18px 1fr;align-items:center;column-gap:8px;font-size:13px}
.tl .t{font-family:var(--f-num);font-variant-numeric:tabular-nums;text-align:right;font-size:12.5px}
.tl .n{font-weight:700}
.tl .k{color:var(--muted);font-size:11px;margin-left:6px;font-weight:400}
.node{width:11px;height:11px;border-radius:50%;border:2.5px solid var(--ink);background:var(--panel);justify-self:center}
.bar{width:5px;justify-self:center;height:100%;min-height:34px;border-radius:3px}
.tl.leg .info{font-size:12px;color:var(--muted);padding-block:6px}
.tl.leg .info b{color:var(--ink);font-weight:500}
.tl.xf .info{font-size:11.5px;color:var(--muted);padding-block:4px}
.xbar{width:0;border-left:2px dotted var(--muted);height:22px;justify-self:center}

details.legend{border-top:1px solid var(--hair);padding-top:12px}
details.legend summary{cursor:pointer;font-size:12px;letter-spacing:.12em;color:var(--muted)}
.lg{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:4px 12px;margin-top:10px;font-size:12px}
.lg span{display:flex;align-items:center;gap:6px}
.lg i{width:18px;border-radius:3px;flex:none}
.note{font-size:11.5px;color:var(--muted);margin:0}

/* map */
.mapwrap{position:relative;min-width:0;background:var(--sea);overflow:hidden;touch-action:none}
#map{width:100%;height:100%;display:block;cursor:grab;user-select:none;-webkit-user-select:none}
#map.drag{cursor:grabbing}
.land{fill:var(--land);stroke:var(--edge);stroke-width:1;vector-effect:non-scaling-stroke;stroke-linejoin:round}
.lines{filter:var(--lf)}
.lines path{fill:none;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke}
.lines.dim path{opacity:.22}
#map[data-lod="0"] .lines .k-t,#map[data-lod="0"] .lines .k-m{display:none}
#map[data-lod="0"] .lines .k-p{opacity:.55}
#map[data-lod="0"] .lines.dim .k-p{opacity:.12}
#seaRect,#land{transition:opacity .2s}
.loading{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:var(--panel);border:1px solid var(--hair);border-radius:10px;padding:12px 18px;font-weight:500;box-shadow:0 6px 24px rgba(10,20,30,.12)}
.hl path{fill:none;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke}
.hl .casing{stroke:var(--land)}
.hl .col{filter:var(--lf)}
.hl .bed,.hl .ties,.hl .railp{vector-effect:none}
.hl .bed{stroke:var(--ballast)}
.hl .ties{stroke-linecap:butt;stroke-linejoin:miter;filter:var(--lf)}
.hl .railp{stroke:var(--rail)}
.trail{fill:none;stroke:var(--trail);stroke-width:2;stroke-dasharray:1 5;stroke-linecap:round;vector-effect:non-scaling-stroke}
.st circle.m{fill:var(--land);stroke:var(--ink);stroke-width:1.3}
.st.x circle.m{stroke-width:2}
.st circle.hit{fill:transparent;cursor:pointer}
.st text{font-size:11px;fill:var(--ink);paint-order:stroke;stroke:var(--land);stroke-width:3.2px;stroke-linejoin:round;font-weight:500;pointer-events:none}
.st.major text{font-size:12.5px;font-weight:700}
.st.end circle.m{fill:var(--ink);stroke:var(--land)}
.st.end text{font-size:13.5px;font-weight:700}
.st.via circle.m{fill:var(--land);stroke:var(--pin);stroke-width:2.6}
.st.via text{font-weight:700;font-size:12.5px}
.st.off text{display:none}
.st.faded{opacity:.62}

.hud{position:absolute;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));background:var(--panel);border:1px solid var(--hair);border-radius:12px;padding:10px 14px;display:grid;grid-template-columns:auto 1fr;gap:8px 14px;align-items:center;box-shadow:0 6px 24px rgba(10,20,30,.12);max-width:760px;margin:0 auto}
.ctl{display:flex;gap:6px}
.btn{width:40px;height:40px;border-radius:50%;border:1px solid var(--hair);background:var(--panel);cursor:pointer;display:grid;place-items:center}
.btn.play{background:var(--pin);border-color:var(--pin);color:var(--pin-ink)}
.btn svg{width:16px;height:16px}
.status{min-width:0;display:grid;gap:2px}
.status .clock{font-family:var(--f-num);font-variant-numeric:tabular-nums;font-size:13px;display:flex;gap:12px;flex-wrap:wrap;align-items:baseline}
.status .clock b{font-size:18px;font-weight:600}
.status .now{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prog{grid-column:1 / 3;height:4px;background:var(--soft);border-radius:2px;overflow:hidden}
.prog i{display:block;height:100%;width:0;background:var(--pin)}
.speed{grid-column:1 / 3;display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:12px}
.speed label{color:var(--muted);letter-spacing:.08em}
.speed input[type=range]{flex:1;min-width:120px;accent-color:var(--pin)}
.speed output{font-family:var(--f-num);font-variant-numeric:tabular-nums;min-width:11em}
.follow{display:flex;align-items:center;gap:5px;color:var(--muted);cursor:pointer}
.follow input{accent-color:var(--pin)}

.zoom{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));right:max(12px,env(safe-area-inset-right,0px));display:grid;gap:6px}
.zoom button{width:36px;height:36px;border-radius:8px;border:1px solid var(--hair);background:var(--panel);cursor:pointer;font-size:18px;line-height:1}
.zoom button.fit{font-size:11px}
.pop{position:absolute;background:var(--panel);border:1px solid var(--hair);border-radius:10px;padding:10px;box-shadow:0 6px 24px rgba(10,20,30,.18);display:grid;gap:6px;min-width:150px;transform:translate(-50%,calc(-100% - 14px));z-index:5}
.pop b{font-size:15px}
.pop .ls{font-size:11px;color:var(--muted)}
.pop div{display:flex;gap:6px}
.pop button{flex:1;border:1px solid var(--hair);border-radius:6px;background:var(--soft);padding:5px 8px;cursor:pointer;font-size:12px;white-space:nowrap}
.pop button:disabled{opacity:.4;cursor:default}
.pop button.t{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.arrived{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--panel);padding:7px 16px;border-radius:999px;font-weight:700;font-size:13px;letter-spacing:.06em}

@media (max-width:760px){
  body{overflow:auto}
  .app{grid-template-columns:1fr;grid-template-rows:62vh auto;height:auto;min-height:100%}
  .mapwrap{order:-1;height:62vh}
  .panel{border-right:0;overflow:visible;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .hud{left:max(8px,env(safe-area-inset-left,0px));right:max(8px,env(safe-area-inset-right,0px));bottom:8px;padding:8px 10px;gap:6px 10px}
  .btn{width:36px;height:36px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <aside class="panel">
    <div class="brand">
      <h1>ピン<i>旅</i></h1>
      <p>全国の鉄道約580路線・9,000駅。選んだ経路を、ピンが線路の上を走って進みます</p>
    </div>

    <form id="q" class="stack" autocomplete="off">
      <div class="search">
        <div class="stack">
          <div class="field"><span class="dot"></span><label for="from">出発</label><input id="from" list="stlist" value="東京" placeholder="駅名を入力"></div>
          <div id="vias" class="stack"></div>
          <div class="field"><span class="dot to"></span><label for="to">到着</label><input id="to" list="stlist" value="博多" placeholder="駅名を入力"></div>
        </div>
        <button type="button" class="swap" id="swap" aria-label="出発と到着を入れ替える" title="入れ替え">
          <svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 2v12M2 5l3-3 3 3M11 14V2M8 11l3 3 3-3"/></svg>
        </button>
      </div>
      <button type="button" class="addvia" id="addVia">＋ 経由駅を追加</button>
      <div class="row2">
        <div class="field"><label for="dep">発時刻</label><input id="dep" type="time" value="09:00"></div>
        <button class="go" type="submit">検索</button>
      </div>
      <p class="err" id="err" hidden></p>
      <datalist id="stlist"></datalist>
    </form>

    <section class="stack" style="gap:10px">
      <div class="sortbar">
        <h2 id="rcount">ルート候補</h2>
        <div class="seg" role="group" aria-label="並び替え">
          <button type="button" id="sortTime" aria-pressed="true">早い順</button>
          <button type="button" id="sortXfer" aria-pressed="false">乗換が少ない順</button>
        </div>
      </div>
      <ol class="routes" id="routes"></ol>
      <p class="note">所要時間は線路の長さと路線の種類（新幹線・JR在来線・私鉄など）から計算した目安で、実際の時刻表とは異なります。</p>
      <p class="note">出典：国土数値情報（鉄道データ 2025年度版）（国土交通省）を加工して作成</p>
    </section>

    <details class="legend">
      <summary>路線の種類</summary>
      <div class="lg" id="legend"></div>
    </details>
  </aside>

  <main class="mapwrap" id="wrap">
    <svg id="map" role="img" aria-label="日本の鉄道路線図">
      <rect id="paper" x="-5000" y="-5000" width="12000" height="12000" fill="var(--land)"></rect>
      <rect id="seaRect" x="-5000" y="-5000" width="12000" height="12000" fill="var(--sea)"></rect>
      <g id="land"></g>
      <g id="lines" class="lines"></g>
      <g id="hl" class="hl"></g>
      <path id="trail" class="trail"></path>
      <g id="stations"></g>
      <g id="pin"></g>
    </svg>
    <div class="zoom">
      <button type="button" id="zin" aria-label="拡大">+</button>
      <button type="button" id="zout" aria-label="縮小">−</button>
      <button type="button" id="zfit" class="fit" aria-label="全体を表示">全体</button>
    </div>
    <div class="loading" id="loading">全国の路線データを読み込み中…</div>
    <div class="arrived" id="arrived" hidden>到着しました</div>
    <div class="pop" id="pop" hidden></div>
    <div class="hud">
      <div class="tip" id="tip" hidden>▶ を押すと、このルートで出発します</div>
      <div class="ctl">
        <button type="button" class="btn play" id="play" aria-label="出発">
          <svg viewBox="0 0 16 16" id="playIcon"><path d="M4 2.5v11l9-5.5z" fill="currentColor"/></svg>
        </button>
        <button type="button" class="btn" id="reset" aria-label="最初に戻す">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M3 8a5 5 0 1 0 1.6-3.7M3 2.5V5h2.5"/></svg>
        </button>
      </div>
      <div class="status">
        <div class="clock"><b id="clk">09:00</b><span id="elapsed">経過 0分 / 0分</span></div>
        <div class="now" id="now">再生ボタンで出発します</div>
      </div>
      <div class="prog"><i id="progBar"></i></div>
      <div class="speed">
        <label for="spd">速さ</label>
        <input type="range" id="spd" min="0" max="100" value="55">
        <output id="spdOut" for="spd"></output>
        <label class="follow"><input type="checkbox" id="follow"> ピンを追う</label>
      </div>
    </div>
  </main>
</div>

<script>
(()=>{
// ---------- 簡略海岸線（縮小表示用。拡大すると薄くなる） ----------

  ST.forEach(s=>GR[s.g].mem.push(s.i));

  EDGES=D.edges.map(([a,b,len,f],i)=>{
    let x=f[0],y=f[1]; const pts=[P(x,y)];
    for(let k=2;k<f.length;k+=2){x+=f[k];y+=f[k+1];pts.push(P(x,y));}
    const L=LINES[ST[a].li], min=len/1000/L.v*60+0.5;
    ST[a].adj.push([b,min,i]); ST[b].adj.push([a,min,i]);
    if(!ST[a].pos) ST[a].pos=pts[0]; if(!ST[b].pos) ST[b].pos=pts[pts.length-1];
    edgeOf.set(a+">"+b,i); edgeOf.set(b+">"+a,i);

  });
  ST.forEach(s=>{if(!s.pos) s.pos=GR[s.g].p;});

  const dl=LINES.map(()=>[]);

// ---------- 経路探索 ----------
function xfer(u,v){
  const A=LINES[ST[u].li],B=LINES[ST[v].li];
  if(A.nm===B.nm||THRU.has(A.nm+">"+B.nm)) return 0;
  if(A.op===B.op) return (A.kind==="j"&&B.kind==="j")?3:5;
  return 8;
}
class Heap{constructor(){this.k=[];this.v=[];}
  push(key,val){const k=this.k,v=this.v;let i=k.length;k.push(key);v.push(val);while(i>0){const p=(i-1)>>1;if(k[p]<=key)break;k[i]=k[p];v[i]=v[p];i=p;}k[i]=key;v[i]=val;}
  pop(){const k=this.k,v=this.v,top=v[0],tk=k[0];const lk=k.pop(),lv=v.pop();if(k.length){let i=0;const n=k.length;while(true){let c=2*i+1;if(c>=n)break;if(c+1<n&&k[c+1]<k[c])c++;if(k[c]>=lk)break;k[i]=k[c];v[i]=v[c];i=c;}k[i]=lk;v[i]=lv;}this.lastKey=tk;return top;}
  get size(){return this.k.length;}}
function dijkstra(sg,tg,opt={}){
  const n=ST.length,dist=new Float64Array(n).fill(Infinity),prev=new Int32Array(n).fill(-1),how=new Int32Array(n).fill(-1);
  const pen=opt.pen, extra=opt.extra||0, h=new Heap();
  for(const s of GR[sg].mem){dist[s]=0;h.push(0,s);}
  while(h.size){
    const u=h.pop(), d=h.lastKey; if(d>dist[u]) continue;
    if(ST[u].g===tg) return buildPath(u,prev,how);
    for(const [v,min,ei] of ST[u].adj){const nd=d+min*(pen&&pen.get(ei)||1);if(nd<dist[v]){dist[v]=nd;prev[v]=u;how[v]=ei;h.push(nd,v);}}
    if(how[u]!==-2) for(const v of GR[ST[u].g].mem){ if(v===u) continue; const c=xfer(u,v); const nd=d+c+(c?extra:0); if(nd<dist[v]){dist[v]=nd;prev[v]=u;how[v]=-2;h.push(nd,v);} }
  }
  return null;
}
function buildPath(u,prev,how){
  const seq=[];while(u!==-1){seq.unshift([u,how[u]]);u=prev[u];}
  const legs=[];let cur=null;
  for(const [s,hw] of seq){
    if(!cur||hw===-2){cur={li:ST[s].li,sts:[s],eis:[]};legs.push(cur);}
    else {cur.sts.push(s);cur.eis.push(hw);}
  }
  return finalize(legs.filter(g=>g.eis.length));
}
function finalize(legs){
  let total=0,km=0,xf=0;
  legs.forEach((g,gi)=>{
    g.min=g.eis.reduce((a,ei)=>a+EDGES[ei].min,0); g.km=g.eis.reduce((a,ei)=>a+EDGES[ei].len,0)/1000;
    g.wait=0;g.through=false;
    if(gi>0){g.wait=xfer(legs[gi-1].sts[legs[gi-1].sts.length-1],g.sts[0]);g.through=g.wait===0;if(!g.through)xf++;}
    total+=g.min+g.wait; km+=g.km;
  });
  const phys=legs.map((g,i)=>g.sts.slice(i?1:0).map(s=>ST[s].g).join(",")).join(",");
  return {legs,total,km,xf,phys};
}
function candidates(a,b){
  const best=dijkstra(a,b); if(!best) return [];
  const out=new Map([[best.phys,best]]), add=r=>{if(r&&!out.has(r.phys))out.set(r.phys,r);};
  add(dijkstra(a,b,{extra:30}));
  const pen=new Map();
  for(let k=0;k<5;k++){
    for(const r of out.values()) for(const g of r.legs) for(const ei of g.eis) pen.set(ei,(pen.get(ei)||1)*1.35);
    add(dijkstra(a,b,{pen}));
  }
  const lim=best.total*1.7+30;
  return [...out.values()].filter(r=>r.total<=lim).sort((x,y)=>x.total-y.total).slice(0,5);
}
function viaCandidates(stops){
  const parts=[];
  for(let i=0;i<stops.length-1;i++){const c=candidates(stops[i],stops[i+1]);if(!c.length)return [];parts.push(c.slice(0,3));}
  const combine=choice=>{const legs=[];
    choice.forEach((ci,pi)=>{for(const g of parts[pi][ci].legs){const last=legs[legs.length-1];
      if(last&&last.li===g.li&&last.sts[last.sts.length-1]===g.sts[0]){last.sts.push(...g.sts.slice(1));last.eis.push(...g.eis);}
      else legs.push({li:g.li,sts:[...g.sts],eis:[...g.eis]});}});
    return finalize(legs);};
  const found=new Map(),add=r=>{const o=found.get(r.phys);if(!o||r.total<o.total)found.set(r.phys,r);};
  const base=parts.map(()=>0); add(combine(base));
  parts.forEach((p,pi)=>p.forEach((_,ci)=>{if(ci){const c=[...base];c[pi]=ci;add(combine(c));}}));
  for(let a=0;a<parts.length;a++)for(let b=a+1;b<parts.length;b++)if(parts[a][1]&&parts[b][1]){const c=[...base];c[a]=1;c[b]=1;add(combine(c));}
  return [...found.values()].sort((x,y)=>x.total-y.total).slice(0,5);
}

const DETAIL=0.42;
function fitBox(pts,pad=0.12){
  let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
  for(const [x,y] of pts){x0=Math.min(x0,x);y0=Math.min(y0,y);x1=Math.max(x1,x);y1=Math.max(y1,y);}
  const cw=svg.clientWidth||800,ch=svg.clientHeight||600,hud=ch>500?0.2:0.28;
  let w=Math.max(x1-x0,4)*(1+pad*2),h=Math.max(y1-y0,4)*(1+pad*2+hud);
  if(w/h<cw/ch) w=h*cw/ch; else h=w*ch/cw;
  return {x:(x0+x1)/2-w/2,y:(y0+y1)/2-h/2+h*hud*0.35,w,h};
}

let stBox=null, routeG=new Set(), endG=new Set(), viaG=new Set(), xferG=new Set();
function renderStations(force){
  if(!GR.length) return;
  const m=0.3;
  if(!force&&stBox&&Math.abs(Math.log(unit/stBox.u))<0.1&&vb.x>=stBox.x0&&vb.y>=stBox.y0&&vb.x+vb.w<=stBox.x1&&vb.y+vb.h<=stBox.y1) return;
  const x0=vb.x-vb.w*m,y0=vb.y-vb.h*m,x1=vb.x+vb.w*(1+m),y1=vb.y+vb.h*(1+m);
  stBox={u:unit,x0,y0,x1,y1};
  const minRank=unit>1.3?9:unit>0.7?7:unit>0.32?4:unit>0.14?2:1;
  let list=[];
  for(const g of GR){const [x,y]=g.p;if(x<x0||x>x1||y<y0||y>y1)continue;
    const onR=routeG.has(g.i); if(g.rank>=minRank||onR&&unit<0.7||endG.has(g.i)||viaG.has(g.i)) list.push(g);}
  const pri=g=>(endG.has(g.i)||viaG.has(g.i)?1000:0)+(xferG.has(g.i)?200:0)+(routeG.has(g.i)?50:0)+g.rank;
  list.sort((a,b)=>pri(b)-pri(a));
  if(list.length>1400) list=list.slice(0,1400);

  update();
  if(!moving){pause();const L=routeSel.legs[routeSel.legs.length-1];$("arrived").textContent=`${GR[ST[L.sts[L.sts.length-1]].g].name}に到着しました`;$("arrived").hidden=false;
    const r=routeSel;setTimeout(()=>{if(routeSel===r&&!playing){followEl.checked=false;animateView(routeBox(r),1500);}},900);return;}
  raf=requestAnimationFrame(tick);
}
const ICON_PLAY='<path d="M4 2.5v11l9-5.5z" fill="currentColor"/>', ICON_PAUSE='<path d="M4 2.5h3v11H4zM9 2.5h3v11H9z" fill="currentColor"/>';
function setHint(){const on=!!routeSel&&!playing&&T===0;$("tip").hidden=!on;$("play").classList.toggle("hint",on);}
function play(){if(!routeSel)return;if(T>=routeSel.total){T=0;hint=0;$("arrived").hidden=true;update();}
  playing=true;last=0;followEl.checked=true;zoomToPin();$("playIcon").innerHTML=ICON_PAUSE;$("play").setAttribute("aria-label","一時停止");setHint();raf=requestAnimationFrame(tick);}
function pause(){playing=false;cancelAnimationFrame(raf);$("playIcon").innerHTML=ICON_PLAY;$("play").setAttribute("aria-label","出発");pbody.removeAttribute("transform");setHint();}
$("play").onclick=()=>playing?pause():play();
$("reset").onclick=()=>{T=0;hint=0;pause();$("arrived").hidden=true;followEl.checked=false;update();if(routeSel)animateView(routeBox(routeSel),900);};
document.addEventListener("keydown",e=>{if(e.code==="Space"&&!/INPUT|BUTTON|SELECT/.test(document.activeElement.tagName)){e.preventDefault();playing?pause():play();}});

// ---------- フォーム ----------
let viaSeq=0;
function addVia(val=""){
  const box=$("vias"); if(box.children.length>=3) return null;
  const id="via"+(++viaSeq), d=document.createElement("div"); d.className="field";
  d.innerHTML=`<span class="dot via"></span><label for="${id}">経由</label><input id="${id}" list="stlist" placeholder="駅名を入力" value="${esc(val)}"><button type="button" class="rm" aria-label="この経由駅を削除" title="削除">×</button>`;
  d.querySelector(".rm").onclick=()=>{const had=d.querySelector("input").value.trim();d.remove();updAdd();if(had)search();};
  d.querySelector("input").addEventListener("change",e=>{if(GKEY.has(e.target.value.trim()))search();});
  box.appendChild(d); updAdd(); return d.querySelector("input");
}
function updAdd(){$("addVia").hidden=$("vias").children.length>=3;}
const viaVals=()=>[...$("vias").querySelectorAll("input")].map(i=>i.value.trim()).filter(Boolean);
$("addVia").onclick=()=>{const i=addVia();if(i)i.focus();};
$("q").onsubmit=e=>{e.preventDefault();search();};
$("swap").onclick=()=>{const a=$("from").value;$("from").value=$("to").value;$("to").value=a;
  const ins=[...$("vias").querySelectorAll("input")],vals=ins.map(i=>i.value).reverse();ins.forEach((i,k)=>i.value=vals[k]);search();};
$("dep").onchange=()=>{if(routeSel){renderList();update();markLegs(true);}};
["from","to"].forEach(id=>$(id).addEventListener("change",()=>{if(GKEY.has($(id).value.trim()))search();}));
$("sortTime").onclick=()=>{sortMode="time";setTimeout(()=>markLegs(true));$("sortTime").setAttribute("aria-pressed","true");$("sortXfer").setAttribute("aria-pressed","false");renderList();};
$("sortXfer").onclick=()=>{sortMode="xfer";setTimeout(()=>markLegs(true));$("sortXfer").setAttribute("aria-pressed","true");$("sortTime").setAttribute("aria-pressed","false");renderList();};

// ---------- 起動 ----------
requestAnimationFrame(()=>{vb=fitBox(JAPAN,0.02);applyView();});
fetch("rail.json").then(r=>{if(!r.ok)throw new Error(r.status);return r.json();}).then(init).catch(()=>{
  $("loading").innerHTML="路線データを読み込めませんでした。ページを再読み込みしてください。";
});
})();

</script>
